exclude: "node_modules|.git"
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "india_compliance.*"
        exclude: ".*json$|.*txt$|.*csv|.*md"
      - id: no-commit-to-branch
        args: ["--branch", "develop"]
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
          (?x)^(
              india_compliance/public/dist/.*|
              cypress/.*|
              .*node_modules.*|
              .*boilerplate.*|
              india_compliance/templates/includes/.*
          )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ["--quiet"]
        # Ignore any files that might contain jinja / bundles
        exclude: |
          (?x)^(
              india_compliance/public/dist/.*|
              cypress/.*|
              .*node_modules.*|
              .*boilerplate.*|
              india_compliance/public/js/controllers/.*|
              india_compliance/templates/pages/order.js|
              india_compliance/templates/includes/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        name: "Remove unused imports"
        args: ["--select=F401", "--fix"]

      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: local
    hooks:
      - id: patch-increment
        name: "Bump patch counter when custom fields / property setters change"
        entry: python india_compliance/scripts/check_patch_increment.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              india_compliance/gst_india/constants/custom_fields\.py|
              india_compliance/gst_india/setup/property_setters\.py|
              india_compliance/income_tax_india/constants/custom_fields\.py|
              india_compliance/audit_trail/constants/custom_fields\.py|
              india_compliance/patches\.txt
          )$

ci:
  autoupdate_schedule: weekly
  # patch-increment compares the staged index against HEAD, which only has
  # meaning for a local `git commit`; on pre-commit.ci nothing is staged, so it
  # would be a silent no-op. Keep it a local-only guard.
  skip: [patch-increment]
  submodules: false
